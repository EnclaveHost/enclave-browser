name: Assemble separate KVM preview after qualified browser
on:
  workflow_run:
    workflows: [Enclave Alpine browser]
    types: [completed]
    branches: [enclave-esr153]
permissions:
  contents: read
  actions: read
jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'EnclaveHost/enclave-browser'
    uses: EnclaveHost/enclave-os/.github/workflows/preview.yml@c3be0de819aec8d71ee3bde57b0d272795d9f642
    with:
      browser_run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      source_ref: c3be0de819aec8d71ee3bde57b0d272795d9f642
  kernel-policy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'EnclaveHost/enclave-browser'
    uses: EnclaveHost/enclave-os/.github/workflows/browser-policy.yml@c3be0de819aec8d71ee3bde57b0d272795d9f642
    with:
      browser_run: ${{ format('{0}', github.event.workflow_run.id) }}
      platform: amd64
      source_ref: c3be0de819aec8d71ee3bde57b0d272795d9f642
