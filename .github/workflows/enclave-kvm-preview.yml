name: Assemble separate KVM preview after qualified browser
on:
  workflow_run:
    workflows: [Enclave Alpine browser]
    types: [completed]
    branches: [enclave-esr153]
permissions:
  contents: read
  actions: read
jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'EnclaveHost/enclave-browser'
    uses: EnclaveHost/enclave-os/.github/workflows/preview.yml@95679ef6202eeaab7552817eccc81d67e01a2c5d
    with:
      browser_run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      source_ref: 95679ef6202eeaab7552817eccc81d67e01a2c5d
  kernel-policy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'EnclaveHost/enclave-browser'
    uses: EnclaveHost/enclave-os/.github/workflows/browser-policy.yml@95679ef6202eeaab7552817eccc81d67e01a2c5d
    with:
      browser_run: ${{ format('{0}', github.event.workflow_run.id) }}
      platform: amd64
      source_ref: 95679ef6202eeaab7552817eccc81d67e01a2c5d
