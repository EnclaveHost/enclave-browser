name: Assemble separate KVM preview after qualified browser
on:
  workflow_run:
    workflows: [Enclave Alpine browser]
    types: [completed]
    branches: [enclave-esr153]
permissions:
  contents: read
  actions: read
jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'EnclaveHost/enclave-browser'
    uses: EnclaveHost/enclave-os/.github/workflows/preview.yml@da05b01e9fbbd8240c34c8eb9f8832d031564fee
    with:
      browser_run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      source_ref: da05b01e9fbbd8240c34c8eb9f8832d031564fee
  kernel-policy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'EnclaveHost/enclave-browser'
    uses: EnclaveHost/enclave-os/.github/workflows/browser-policy.yml@da05b01e9fbbd8240c34c8eb9f8832d031564fee
    with:
      browser_run: ${{ format('{0}', github.event.workflow_run.id) }}
      platform: amd64
      source_ref: da05b01e9fbbd8240c34c8eb9f8832d031564fee
